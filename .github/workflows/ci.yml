name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo cancela a execução anterior do mesmo branch: nada de fila de
# builds obsoletos disputando runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Silencia o aviso de "modules dir purge" do pnpm em ambiente sem TTY.
  CI: "true"

jobs:
  verificacao:
    name: Formato, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Formato e lint
        run: pnpm exec biome ci .

      - name: Tipos
        run: pnpm run check-types

      # Roda a suíte de todos os pacotes: domínio, adaptadores e site. Os
      # testes de integração do Drizzle se pulam sozinhos sem DATABASE_URL,
      # então o job não precisa de Postgres.
      - name: Testes unitários e de integração
        run: pnpm run test

      - name: Build
        run: pnpm --filter web build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Só roda se a verificação passou: e2e é caro e falharia pelos mesmos
    # motivos.
    needs: verificacao

    # O painel precisa de banco para provar que carrega e grava o catálogo. O
    # site público continua sem: o servidor da suíte sem banco recebe
    # `DATABASE_URL` vazia pela configuração do Playwright, então a variável
    # existir aqui não afrouxa nada.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saojorge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/saojorge
      BETTER_AUTH_SECRET: segredo-de-teste-apenas-para-o-ci-do-e2e-0001
      BETTER_AUTH_URL: http://localhost:3102

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Instalar navegador do Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Build
        run: pnpm --filter web build

      # O preparo da suíte aplica o schema e carrega o catálogo: basta o
      # Postgres do serviço estar de pé, vazio.
      - name: End-to-end
        run: pnpm --filter web exec playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
